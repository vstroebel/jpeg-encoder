[package]
name = "jpeg-encoder"
version = "0.8.0"
authors = ["Volker Ströbel <volkerstroebel@mysurdity.de>"]
edition = "2024"
license = "(MIT OR Apache-2.0) AND IJG"
description = "JPEG encoder"
categories = ["multimedia::images"]
keywords = ["jpg", "jpeg", "encoder", "image"]
readme = "README.md"
repository = "https://github.com/vstroebel/jpeg-encoder"
rust-version = "1.89"

[features]
default = ["std"]
simd = ["std"]
std = ["fearless_simd?/std"]
# Historical feature name; the portable FDCT now uses fearless_simd.
use_wide = ["dep:fearless_simd"]

# DO NOT USE THIS IN PRODUCTION. Expose several internal functions for benchmark purposes.
benchmark = []

[dependencies]
fearless_simd = { version = "1.1", optional = true, default-features = false, features = ["libm"] }

[dev-dependencies]
jpeg-decoder = { version = "0.3", default-features = false }
fearless_simd = { version = "1.1", default-features = false, features = ["libm", "force_support_fallback"] }

[profile.dev]
opt-level = 1
