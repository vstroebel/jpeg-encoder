[package]
name = "jpeg-encoder-bench"
version = "0.0.0"
authors = ["Volker Ströbel <volkerstroebel@mysurdity.de>"]
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[workspace]
members = ["."]

[features]
simd = ["jpeg-encoder/simd"]
portable_simd = ["fearless_simd", "jpeg-encoder/portable_simd"]
portable_simd_no_std = ["fearless_simd", "jpeg-encoder/portable_simd_no_std"]
# Internal implementation feature shared by the portable SIMD benchmarks.
fearless_simd = ["jpeg-encoder/fearless_simd"]

[dependencies]
jpeg-encoder = {path = "..", features = ["benchmark"]}

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["plotters", "cargo_bench_support"]}

[profile.dev]
opt-level = 1

[[bench]]
name = "encode"
harness = false

[[bench]]
name = "fdct"
harness = false

[[bench]]
name = "ycbcr"
harness = false
